# LabTrack : PostgreSQL + Django (gunicorn) + nginx.
# Démarrage :  cp .env.example .env  (puis éditer)  &&  docker compose up -d --build
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-labtrack}
      POSTGRES_USER: ${DB_USER:-labtrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-labtrack} -d ${DB_NAME:-labtrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Définir DJANGO_SECRET_KEY dans .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DB_NAME: ${DB_NAME:-labtrack}
      DB_USER: ${DB_USER:-labtrack}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
    volumes:
      - static:/app/staticfiles
      - media:/app/media

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${LABTRACK_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
      - media:/srv/media:ro

volumes:
  pgdata:
  static:
  media:
